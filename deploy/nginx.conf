# 心智宇宙 INFINITY — Nginx 配置（方案书 7.2）
# 放置：/etc/nginx/conf.d/infinity.conf（或 sites-available + 软链）
# 说明：仅 HTTPS；静态前端 dist/；/api 反代到本机 8787；上传上限 12MB（附件单文件 10MB）

server {
    listen 80;
    listen [::]:80;
    server_name _;                    # 改成你的域名（若有备案域名）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;                    # 改成你的域名

    # 证书路径（certbot 签发后替换）
    ssl_certificate     /etc/letsencrypt/live/你的域名/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    root /opt/infinity/app/dist;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API 反代（仅本机 8787；Node 只监听内网）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 静态资源缓存（Service Worker 由 PWA 插件处理更新）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
